<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalmenTravel+ - Home</title>

    <!-- Icono de SalmenTavel+ en el navegador -->
    <link rel="shortcut icon" type="image/x-icon" href="../assets/images/SalmenTravelLogoNaranja.png">

    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fuentes usados en la web -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chela+One&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Josefin+Sans:ital@0;1&family=Londrina+Solid:wght@100;300;400;900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jaini+Purva&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/css/home.css">
    <link rel="stylesheet" href="./assets/css/menu.css">
    
    <!-- JS -->
    <script src="assets/js/menuArriba.js" type="module"></script>
</head>

<body>

    <header>
        <section class="header-container">

            <!-- ICONO HAMBURGUESA (solo aparece en pantallas pequeñas) -->
            <div id="hamburguer" class="menu-icon">
                <img src="assets/images/hamburger_menu.png" alt="menú hamburguesa">
            </div>

            <!-- NAV NORMAL (en tamaño móvil se oculta) -->
            <nav id="mainNav">
                <a href="home.html">Home</a>
                <a href="viajes.html">Viajes</a>
                <a href="clima.html">Clima</a>
                <a href="aboutUs.html">Sobre Nosotros</a>
                <a href="sugerenciasIA.html">Sugerencias con IA</a>
            </nav>

            <a href="home.html">
                <img src="assets/images/SalmenTravelLogo.png" alt="Logo de salmen travel">
            </a>
        </section>

        <!-- MENÚ DESPLEGABLE MÓVIL -->
        <section id="menu" class="mobile-menu">

            <button id="closeMenuButton" class="close-btn">
                <img src="assets/images/x_cerrar_menu.png" alt="Cerrar menú">
            </button>

            <a href="home.html">Home</a>
            <a href="viajes.html">Viajes</a>
            <a href="clima.html">Clima</a>
            <a href="aboutUs.html">Sobre Nosotros</a>
            <a href="sugerenciasIA.html">Sugerencias con IA</a>
        </section>
    </header>

    <main class="py-5">

        <!--  Envoltorio para el scroll horizontal (para hacer la libreta responsive) -->
        <section class="notebook-scroll">

            <div class="notebook-wrapper">

                <!-- Capas traseras de la libreta -->
                <div id="cover-green" class="cover-page"></div>
                <div id="cover-light" class="cover-page"></div>
                <div id="cover-beige" class="cover-page"></div>

                <!-- Página superior -->
                <div id="cover-top" class="cover-page">

                    <div class="pages-inside">

                        <!-- Página izquierda de la libreta -->
                        <section class="page-left">

                            <div class="page-left-header">
                                <div class="title-banner"></div>
                                <h2 class="page-title">Escribe tu próxima aventura</h2>
                            </div>

                            <div class="page-left-content">
                                <img src="assets/images/imagen_pag_izq_home.png" id="imagen_cuaderno" alt="scrapbook">
                            </div>
                        </section>

                        <!-- Página derecha -->
                        <section class="page-right">
                            <div class="right-image-wrapper">
                                <img src="assets/images/img_pag_der.png" alt="sellos Tokyo">
                            </div>
                        </section>

                    </div>

                </div>
            </div>
        </section>

        <section class="container-fluid empezar-section">

            <!-- HEADER -->
            <div class="empezar-header text-center">
                <h2>Elige por dónde empezar</h2>
            </div>

            <!-- CONTENIDO TARJETA -->
            <div class="empezar-content container mt-4">

                <div class="row justify-content-center g-6">

                    <!-- MINI-TARJETA VIAJES -->
                    <div class="col-12 col-md-4 d-flex justify-content-center">
                        <a href="viajes.html" class="mini-card card text-center">
                            <div class="washitape"></div>
                            <img src="assets/images/apartado_viajes.png" class="card-img-top" alt="Mis viajes">
                            <div class="card-body">
                                <p class="card-title">Mis Viajes</p>
                            </div>
                        </a>
                    </div>

                    <!-- MINI-TARJETA CLIMA -->
                    <div class="col-12 col-md-4 d-flex justify-content-center">
                        <a href="clima.html" class="mini-card card text-center">
                            <div class="washitape"></div>
                            <img src="assets/images/apartado_clima.png" class="card-img-top" alt="Clima">
                            <div class="card-body">
                                <p class="card-title">Clima</p>
                            </div>
                        </a>
                    </div>

                    <!-- MINI-TARJETA IA -->
                    <div class="col-12 col-md-4 d-flex justify-content-center">
                        <a href="sugerenciasIA.html" class="mini-card card text-center">
                            <div class="washitape"></div>
                            <img src="assets/images/apartado_IA.png" class="card-img-top" alt="IA">
                            <div class="card-body">
                                <p class="card-title">Sugerencias con IA</p>
                            </div>
                        </a>
                    </div>

                </div>
            </div>
        </section>

    </main>

</body>
</html>
