<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalmenTravel+ - Tus Viajes</title>

    <!-- Icono de SalmenTavel+ en el navegador -->
    <link rel="shortcut icon" type="image/x-icon" href="../assets/images/SalmenTravelLogoNaranja.png">

    <!-- Fuentes usados en la web -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chela+One&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Josefin+Sans:ital@0;1&family=Londrina+Solid:wght@100;300;400;900&display=swap"
        rel="stylesheet">

    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- CSS -->    
    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/css/viajes.css">
    <link rel="stylesheet" href="./assets/css/menu.css">
    <link rel="stylesheet" href="./assets/css/utils/popup.css">

    <!-- JS -->
    <script src="assets/js/utils/popup.js" type="module"></script>
    <script src="assets/js/viajes/viajes.js" type="module"></script>
    <script src="assets/js/menuArriba.js" type="module"></script>
    
</head>

<body>
    <header>
        <section class="header-container">

            <!-- ICONO HAMBURGUESA (solo aparece en pantallas pequeñas) -->
            <div id="hamburguer" class="menu-icon">
                <img src="assets/images/hamburger_menu.png" alt="menú hamburguesa">
            </div>

            <!-- NAV NORMAL (en tamaño móvil se oculta) -->
            <nav id="mainNav">
                <a href="home.html">Home</a>
                <a href="viajes.html">Viajes</a>
                <a href="clima.html">Clima</a>
                <a href="aboutUs.html">Sobre Nosotros</a>
                <a href="sugerenciasIA.html">Sugerencias con IA</a>
            </nav>

            <a href="home.html">
                <img src="assets/images/SalmenTravelLogo.png" alt="Logo de salmen travel">
            </a>
        </section>

        <!-- MENÚ DESPLEGABLE MÓVIL -->
        <section id="menu" class="mobile-menu">

            <button id="closeMenuButton" class="close-btn">
                <img src="assets/images/x_cerrar_menu.png" alt="Cerrar menú">
            </button>

            <a href="home.html">Home</a>
            <a href="viajes.html">Viajes</a>
            <a href="clima.html">Clima</a>
            <a href="aboutUs.html">Sobre Nosotros</a>
            <a href="sugerenciasIA.html">Sugerencias con IA</a>
        </section>
    </header>

    <!-- CONTENIDO PRINCIPAL DE LA PÁGINA -->
    <main class="container">
        <div class="contenido">
            <div class="col-12 col-md-11 col-lg-10">

                <!-- TÍTULO DE LA PÁGINA -->
                <div class="Título">
                    <h1 class="titulo">Tus viajes</h1>
                </div>

                <!-- CARD de los viajes -->
                <section class="tarjetaViaje">
                    <!-- Botón para crear un viaje -->
                    <a href="viajes/nuevoViaje.html" class="botón">
                        <img src="assets/images/add-button.png" alt="Icono nuevo viaje" class="ícono">
                        <span>Nuevo Viaje</span>
                    </a>

                    <!-- CONTENEDOR DE LA TABLA DE VIAJES -->
                    <div class="tabla-scroll">
                        
                        <!-- CABECERA DE CADA COLUMNA -->
                        <div class="columnasInfo">
                            <div>Destino</div>
                            <div>Fecha de inicio</div>
                            <div>Fecha de vuelta</div>
                        </div>

                        <!-- INFORMACIÓN DINÁMICO DE VIAJES -->
                        <div class="InfoContenido"></div>
                    </div>
                </section>

            </div>
        </div>
    </main>
</body>

</html>
